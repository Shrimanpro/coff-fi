[package]
name = "coff-fi"
version = "0.8.0"
edition = "2021"
description = "Coff-fi — a cosy local music player"

[lib]
name = "coffi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
symphonia = { version = "0.5", features = ["all"] }
cpal = "0.15"
rtrb = "0.3"
rubato = "0.16"
lofty = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
rayon = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
urlencoding = "2"
md5 = "0.7"
tokio = { version = "1.54.1", features = ["net", "sync", "time", "macros", "rt"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "connect"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
libc = "0.2.191"
notify = "6"
notify-debouncer-mini = "0.4"
souvlaki = "0.8"
discord-rich-presence = "1.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
